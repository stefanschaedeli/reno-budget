[project]
name = "reno-budget-api"
version = "0.2.0"
description = "Reno-Budget backend (FastAPI + SQLAlchemy + Postgres)"
requires-python = ">=3.12"
readme = "../README.md"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=23.1",
  "pyjwt[crypto]>=2.10",
  "python-multipart>=0.0.20",
  "email-validator>=2.2",
  "python-magic>=0.4.27",
  "slowapi>=0.1.9",
  "apscheduler>=3.10",
  "httpx>=0.28",
  "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "bandit>=1.8",
  "pip-audit>=2.7",
  "types-passlib",
  "testcontainers[postgres]>=4.8",
  "aiosmtplib>=3.0",
]
exports = [
  "openpyxl>=3.1",
  "weasyprint>=63.0",
  "reportlab>=4.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----- Ruff -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                 # isort
  "B",                 # bugbear
  "UP",                # pyupgrade
  "S",                 # bandit-lite
  "C4",                # comprehensions
  "SIM",               # simplifications
  "PTH",               # pathlib
  "RUF",               # ruff-specific
]
ignore = [
  "S101",              # asserts ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

# ----- mypy -----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["magic", "passlib.*", "apscheduler.*"]
ignore_missing_imports = true

# ----- pytest -----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a real PostgreSQL instance (testcontainers)",
  "e2e: end-to-end tests against the running API",
]

# ----- coverage -----
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0   # Bumped in later phases when real code lands
